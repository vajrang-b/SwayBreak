<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <title>SwayBreak</title>
    <link rel="stylesheet" href="css/styles.css?v=25">
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <h1>SwayBreak</h1>
          <p>Lean. Jump. Smash.</p>
        </div>
        <div class="scoreboard" aria-live="polite">
          <div class="score-pill score-pill-primary"><span>Score</span><strong id="score">0</strong></div>
          <div class="score-pill time-pill"><span>Time</span><strong id="time" aria-live="off">1:30</strong></div>
          <div class="score-pill"><span>Round</span><strong id="round">1</strong></div>
          <div class="score-pill"><span>Best</span><strong id="best-score">--</strong></div>
          <div class="score-pill"><span>Lives</span><strong id="lives" aria-label="unlimited">∞</strong></div>
        </div>
      </header>
      <div class="time-track" role="meter" aria-label="Round time remaining" aria-valuemin="0" aria-valuemax="90" aria-valuenow="90">
        <div id="time-progress"></div>
      </div>

      <div class="controls">
        <div class="buttons-row">
          <button id="posture-button" class="primary-button awaiting-start" type="button">Start playing</button>
          <button id="sound-button" class="secondary-button" type="button" aria-label="Mute sound" aria-pressed="true">Sound: On</button>
          <label class="secondary-button ar-mode-control">
            <input id="ar-mode-toggle" type="checkbox" disabled>
            <span>Camera background (AR)</span>
          </label>
          <button id="fullscreen-button" class="secondary-button" type="button" aria-label="Toggle full screen" aria-pressed="false">
            <span class="fs-label">⛶ Full screen</span>
          </button>
          <details class="more-menu">
            <summary class="secondary-button menu-trigger">
              <span aria-hidden="true">☰</span>
              <span>Menu</span>
            </summary>
            <div class="menu-panel">
              <a class="menu-link" href="recordings.html">My recordings</a>
              <label class="menu-setting"><input id="auto-save-toggle" type="checkbox"> Auto-save recordings</label>
              <p>Saved only on this device.</p>
            </div>
          </details>
        </div>
        <div id="auto-save-status" class="visually-hidden" role="status"></div>
        <div id="posture-status" class="inline-status" role="status" hidden></div>
        <div id="recording-status" class="inline-status" role="status" aria-live="polite" hidden></div>
        <div class="recording-actions">
          <button id="save-recording-button" type="button" hidden>Save video</button>
          <button id="save-events-button" type="button" hidden>Save event markers</button>
        </div>
      </div>

      <p id="challenge-status" class="challenge-banner" role="status" hidden></p>
      <section class="game-wrap" aria-label="Brick breaker game">
        <video id="camera" playsinline muted hidden aria-hidden="true"></video>
        <canvas class="camera" id="pose-preview" width="240" height="180" aria-label="Camera preview with pose tracking" hidden></canvas>
        <canvas id="game" width="960" height="600" aria-label="Game field"></canvas>
        <button id="floating-fullscreen-btn" class="game-fullscreen-btn" type="button" aria-label="Toggle full screen" title="Toggle full screen (F)">
          <span class="fs-icon-enter" aria-hidden="true">⛶</span>
          <span class="fs-icon-exit" aria-hidden="true">✕</span>
        </button>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-message"></p>
            <button id="share-score-button" type="button" hidden>Share challenge</button>
            <p id="share-score-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <div class="camera-preview-slot">
        <div id="camera-guide" class="camera-guide">
          <span class="camera-guide-icon">◎</span>
          <span>Stand back so your shoulders show</span>
        </div>
      </div>
      <p class="help">
        <span>↔ Lean to move</span>
        <span aria-hidden="true">·</span>
        <span>👐 Reach to widen</span>
        <span aria-hidden="true">·</span>
        <span>⚡ Jump to smash</span>
      </p>
    </main>

    <script type="module" src="js/main.js?v=35"></script>
  </body>
</html>
